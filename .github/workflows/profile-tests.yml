name: Test profile graphics

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: profile-graphics-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test profile automation
        run: node --test test/*.test.mjs
